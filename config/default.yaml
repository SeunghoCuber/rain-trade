# RainTrade default config. Venue/settlement values are verified in docs/VERIFIED.md.
# Prices are in dollars (0..1); 1 cent = 0.01.

market:
  coin: btc
  durationSec: 900
  slugPrefix: btc-updown-15m

venue:
  gammaUrl: https://gamma-api.polymarket.com
  clobUrl: https://clob.polymarket.com
  clobWsUrl: wss://ws-subscriptions-clob.polymarket.com/ws/market
  rtdsWsUrl: wss://ws-live-data.polymarket.com
  tickSize: 0.01
  minOrderSize: 5
  feeSchedule:          # Gamma market.feeSchedule (feeType crypto_fees_v2)
    rate: 0.07
    exponent: 1
    takerOnly: true
    rebateRate: 0.2
  complementaryMatching: true

spot:
  binanceWsUrl: wss://data-stream.binance.vision/stream
  coinbaseWsUrl: wss://ws-feed.exchange.coinbase.com
  symbol: { binance: btcusdt, coinbase: BTC-USD }

settlement:
  tieGoesTo: up         # "greater than or equal to the price at the beginning"
  twapWindow: { fromSec: -62, toSec: -3 }   # mean of 1 s Chainlink ticks; docs/VERIFIED.md §2.1
  twapToleranceUsd: 1.0                      # RTDS reproduces the official TWAP to ≤ ~$0.7, not exactly
  mergePairs: true

recorder:
  dataDir: data
  discoveryPollSec: 30
  preRegisterSec: 60
  postCloseGraceSec: 5
  resolutionGiveUpSec: 7200   # Gamma publishes finalPrice ~20 min after close
  maxGapMs: 2000
  silenceMs: { clob: 30000, rtds: 5000, binance: 5000, coinbase: 5000 }
  dropMirrored: true
  spotSources: [binance, coinbase]
  statusIntervalSec: 10
  preventSleep: true          # macOS only; lid-close still sleeps unless in clamshell mode
  alertWebhookUrl: null

fairValue:
  volHalfLivesSec: [60, 600]
  spotInput: spot_mid
  initSigmaPerSec: 0.00009
  basisHalfLifeSec: 120
  spotStaleMs: 2000
  twapNoiseUsd: 0.2

strategy:
  halfSpread: 0.01
  volSpreadMult: 0.5
  skewPerShare: 0.0002         # 2¢ at the 100-share cap
  maxInventory: 100            # was 500: held inventory is a coin flip at settlement
  quoteSize: 20                # was 50: often > 20% of its level (sanity check 6)
  requoteThreshold: 0.003
  pullBeforeCloseSec: 60
  pullOnSpotJump: { bp: 8, windowMs: 500 }
  jumpCooldownMs: 2000
  inventoryDecaySec: 300       # cap → 0 over the last 5 min before the pull: arrive flat
  unwindEdge: 0                # reducing quote at FV while over the shrinking cap
  fvBand: [0.05, 0.95]         # outside: only reduce, never add
  volHorizonSec: 5

sim:
  seed: 42
  modes:
    optimistic:  { ackLatencyMs: 50,  cancelLatencyMs: 50,  queuePadFrac: 0,   cancelsAheadFrac: prorata }
    base:        { ackLatencyMs: 150, cancelLatencyMs: 150, queuePadFrac: 0,   cancelsAheadFrac: 0.5 }
    pessimistic: { ackLatencyMs: 400, cancelLatencyMs: 400, queuePadFrac: 0.1, cancelsAheadFrac: 0 }

report:
  minMarkets: 2000
  minDays: 21
  minTStat: 2.5
  bankrollUsd: 5000
  maxDrawdownFrac: 0.2
  plateauFrac: 0.3
  brierTolerance: 0.01
  inSampleFrac: 0.7

dashboard:
  timeZone: America/Los_Angeles   # PT: shows PDT in summer, PST in winter

live:
  outDir: data/live
  modes: [optimistic, base, pessimistic]
  statusIntervalSec: 10
  killSwitch:
    maxDrawdownUsd: 1000
    minRolling7dEdgeCents: -0.5
    minMarkets: 200
